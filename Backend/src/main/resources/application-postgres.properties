# Postgres instead of the default H2 file:
#
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=postgres
#
# Needs Docker running. Spring Boot's Docker Compose support starts the service in compose.yaml and
# supplies the datasource url/username/password from the running container - including its host
# port, which compose assigns dynamically, so no hardcoded URL here would be correct. That is why
# the datasource properties are cleared rather than set: a blank url lets the compose connection
# details win, where the H2 default from application.properties would otherwise still apply.
#
# To use a Postgres you run yourself, set SPRING_DATASOURCE_URL and friends instead - that works
# without this profile.

spring.datasource.url=
spring.datasource.username=
spring.datasource.password=

spring.docker.compose.enabled=true
spring.docker.compose.lifecycle-management=start-and-stop
