spring.application.name=multi-agent-ai-platform
server.port=8080
# This machine only, until HTTPS exists (Phase 7)
server.address=127.0.0.1
# Session cookie: hidden from scripts, and never sent with a request started by another site
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=8h
# Read keys from Backend/.env, which git ignores
spring.config.import=optional:file:.env[.properties]
# Errors as problem+json - the console shows their "detail" text
spring.mvc.problemdetails.enabled=true
management.endpoints.web.exposure.include=health

# --- AI providers -------------------------------------------------------------
# Tried in this order; a provider without a key is skipped, and when one fails the next one
# answers. Keys come from Backend/.env - never put one in this file.
platform.ai.providers=${AI_PROVIDERS:groq,openrouter,google-genai,openai,anthropic}

# Groq (https://console.groq.com/keys) - OpenAI-compatible
platform.ai.groq.api-key=${GROQ_API_KEY:}
platform.ai.groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}
platform.ai.groq.base-url=https://api.groq.com/openai/v1

# OpenRouter (https://openrouter.ai/keys) - OpenAI-compatible; "openrouter/auto" picks a model
platform.ai.openrouter.api-key=${OPENROUTER_API_KEY:}
platform.ai.openrouter.model=${OPENROUTER_MODEL:openrouter/auto}
platform.ai.openrouter.base-url=https://openrouter.ai/api/v1

# Google Gemini (https://aistudio.google.com/apikey)
platform.ai.gemini.api-key=${GEMINI_API_KEY:}
platform.ai.gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}

# OpenAI (https://platform.openai.com/api-keys)
platform.ai.openai.api-key=${OPENAI_API_KEY:}
platform.ai.openai.model=${OPENAI_MODEL:gpt-4o-mini}

# Anthropic Claude (https://console.anthropic.com/settings/keys)
platform.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
platform.ai.anthropic.model=${ANTHROPIC_MODEL:claude-sonnet-5-5}

# AiConfig builds a client for each provider that has a key; Spring AI's own per-provider setup
# is off because it refuses to start with an empty key. Unused model types are off too.
spring.ai.model.chat=none
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

# Fail over fast: one retry inside a provider, then the next provider, instead of minutes of
# back-off on a rate-limited one. (Gemini retries through this; the others through their SDK.)
spring.ai.retry.max-attempts=2
spring.ai.retry.backoff.initial-interval=1s

# --- Platform ----------------------------------------------------------------
# How many recent messages of a conversation are replayed to the model.
platform.memory.max-messages=20
# Attached file text beyond this many characters is cut before it reaches the model (shared
# evenly between the files of one message).
platform.documents.max-context-chars=60000
# Once this many uploads are stored, saving a new one deletes the oldest.
platform.documents.max-stored=50

# --- Uploads -----------------------------------------------------------------
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# --- Storage -----------------------------------------------------------------
# Uploads and conversation memory live in an H2 database file under Backend/data (git ignores it),
# so they survive a restart with nothing to install. The path is relative to where the backend
# runs, so start it from Backend/.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/platform}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
# platform_documents, from schema.sql. "always" because the default only initialises in-memory
# databases; every statement in that file is IF NOT EXISTS.
spring.sql.init.mode=always
# SPRING_AI_CHAT_MEMORY, from Spring AI's own DDL
spring.ai.chat.memory.repository.jdbc.initialize-schema=always

# --- Accounts (MongoDB) ------------------------------------------------------
# Sign-up and login accounts live in MongoDB; the address comes from MONGODB_URI in Backend/.env.
# Uploads and chat memory stay in the H2 file above.
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/agents}
# Create the unique index on username at startup, so the database refuses duplicate accounts
spring.data.mongodb.auto-index-creation=true
