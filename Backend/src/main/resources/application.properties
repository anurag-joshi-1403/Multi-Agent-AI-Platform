spring.application.name=multi-agent-ai-platform
server.port=8080
# This machine only, until login exists (Phase 5)
server.address=127.0.0.1
# Read keys from Backend/.env, which git ignores
spring.config.import=optional:file:.env[.properties]
# Errors as problem+json - the console shows their "detail" text
spring.mvc.problemdetails.enabled=true
management.endpoints.web.exposure.include=health

# --- Google Gemini ----------------------------------------------------------
# Never put a key in this file. The placeholder lets the app boot without one; agent calls then
# fail with a clear 502 until GEMINI_API_KEY is set in Backend/.env.
spring.ai.google.genai.api-key=${GEMINI_API_KEY:missing-api-key}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
spring.ai.google.genai.chat.options.max-output-tokens=8192
spring.ai.google.genai.chat.options.temperature=0.2
# Switch off model types we don't use
spring.ai.model.embedding=none

# --- Platform ----------------------------------------------------------------
# How many recent messages of a conversation are replayed to the model.
platform.memory.max-messages=20
# Attached file text beyond this many characters is cut before it reaches the model (shared
# evenly between the files of one message).
platform.documents.max-context-chars=60000
# Once this many uploads are stored, saving a new one deletes the oldest.
platform.documents.max-stored=50

# --- Uploads -----------------------------------------------------------------
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# --- Storage -----------------------------------------------------------------
# Uploads and conversation memory live in an H2 database file under Backend/data (git ignores it),
# so they survive a restart with nothing to install. The path is relative to where the backend
# runs, so start it from Backend/.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/platform}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
# platform_documents, from schema.sql. "always" because the default only initialises in-memory
# databases; every statement in that file is IF NOT EXISTS.
spring.sql.init.mode=always
# SPRING_AI_CHAT_MEMORY, from Spring AI's own DDL
spring.ai.chat.memory.repository.jdbc.initialize-schema=always
