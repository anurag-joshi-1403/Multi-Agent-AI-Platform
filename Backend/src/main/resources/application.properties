spring.application.name=multi-agent-ai-platform

# --- LLM provider ------------------------------------------------------------
# Pick ONE chat provider with AI_PROVIDER: google-genai (default) | anthropic | openai.
# Only the selected provider's chat model is created; the others stay dormant.
spring.ai.model.chat=${AI_PROVIDER:google-genai}

# Never put keys in this file. Export the matching *_API_KEY in your shell / IDE run config.
# The placeholder defaults let the app boot without a key (so /api/agents and document uploads
# work); agent calls then fail with a clear 502 until the key for the active provider is set.

# Google Gemini (Gemini Developer API key from https://aistudio.google.com/apikey)
spring.ai.google.genai.api-key=${GEMINI_API_KEY:missing-api-key}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
spring.ai.google.genai.chat.options.max-output-tokens=8192
spring.ai.google.genai.chat.options.temperature=0.2

# Anthropic Claude (https://console.anthropic.com/settings/keys)
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:missing-api-key}
spring.ai.anthropic.chat.options.model=${ANTHROPIC_MODEL:claude-opus-5}
spring.ai.anthropic.chat.options.max-tokens=8192
# temperature/top_p/top_k are rejected (HTTP 400) by Claude Opus 5 / Sonnet 5, so none are set.

# OpenAI (https://platform.openai.com/api-keys)
spring.ai.openai.api-key=${OPENAI_API_KEY:missing-api-key}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.temperature=0.2
spring.ai.openai.chat.options.max-tokens=4096

# Non-chat model types are not used; switch them off so no starter demands extra keys.
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

# --- Platform ----------------------------------------------------------------
# Browser origin patterns allowed to call the API directly (the Vite dev proxy needs none of
# this - only a browser calling the API without going through the proxy does). Vite falls back
# to the next free port when 5173 is busy, so this matches any localhost port, not just 5173.
platform.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*
# How many recent messages of a conversation are replayed to the model.
platform.memory.max-messages=20
# Document text beyond this many characters is truncated before it reaches the model.
platform.documents.max-context-chars=60000
# Oldest uploads are evicted once this many documents are held in memory.
platform.documents.max-stored=50

# --- Web ---------------------------------------------------------------------
server.port=8080
# RFC 9457 problem+json bodies for MVC errors (validation, 404, etc.)
spring.mvc.problemdetails.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# --- Actuator ----------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# --- Infrastructure ----------------------------------------------------------
# Postgres (compose.yaml) is reserved for the persistence phase; nothing uses it yet,
# so do not try to start Docker on boot.
spring.docker.compose.enabled=false

logging.level.com.project.multi_agent_ai_platform=INFO
