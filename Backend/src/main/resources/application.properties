spring.application.name=multi-agent-ai-platform

# --- LLM provider (OpenAI) ---------------------------------------------------
# Never put the key in this file. Export OPENAI_API_KEY in your shell / IDE run config.
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.2
spring.ai.openai.chat.options.max-tokens=2048

# The OpenAI starter auto-configures six model types and each one demands a key
# at startup. Only chat is needed for Phase 2; switch the rest off explicitly.
spring.ai.model.chat=openai
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

# Retry transient provider errors (429/5xx) before surfacing them to the caller.
spring.ai.retry.max-attempts=3
spring.ai.retry.backoff.initial-interval=1s
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=8s

# --- Web ---------------------------------------------------------------------
# RFC 9457 problem+json bodies for MVC errors (validation, 404, etc.)
spring.mvc.problemdetails.enabled=true

# --- Actuator ----------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
