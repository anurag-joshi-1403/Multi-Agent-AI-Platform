# The pre-persistence behaviour, kept as a profile so this platform can still be run with nothing
# installed - no Postgres, no Docker:
#
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=memory
#
# Everything works exactly as it did before persistence landed, which also means a restart forgets
# every uploaded document and every conversation.

platform.storage=memory

# Nothing to start and nothing to migrate.
spring.docker.compose.enabled=false
spring.sql.init.mode=never

# Without these the app would still demand a datasource on boot: the Postgres driver is on the
# classpath, and Spring AI's JDBC chat-memory auto-configuration registers a schema initializer
# that needs a DataSource whether or not its repository bean backed off. StorageConfig supplies the
# in-memory ChatMemoryRepository that replaces it.
spring.autoconfigure.exclude=\
  org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,\
  org.springframework.ai.model.chat.memory.repository.jdbc.autoconfigure.JdbcChatMemoryRepositoryAutoConfiguration
