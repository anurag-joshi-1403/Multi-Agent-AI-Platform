# Test classpath shadows src/main/resources/application.properties.
# Bean construction needs *a* key; no test may call the real API with it.
spring.ai.model.chat=google-genai
spring.ai.google.genai.api-key=test-key-not-used
spring.ai.google.genai.chat.options.model=gemini-2.5-flash
spring.ai.anthropic.api-key=test-key-not-used
spring.ai.openai.api-key=test-key-not-used

spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

spring.mvc.problemdetails.enabled=true
spring.docker.compose.enabled=false
