# Test classpath shadows src/main/resources/application.properties, so tests never import
# Backend/.env and never see a real key. Bean construction needs *a* key; no test may call the
# real API with it - agents are tested against StubChatModel instead.
spring.application.name=multi-agent-ai-platform
spring.mvc.problemdetails.enabled=true

# Only Gemini has a (fake) key, so the chain has exactly one active provider.
platform.ai.gemini.api-key=test-key-not-used
platform.ai.gemini.model=gemini-test
spring.ai.model.chat=none
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

# One known account for the login tests; nothing else reads it.
platform.auth.users=tester:tester-password
